services:
  # Base de datos Microsoft SQL Server 2022
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sysaplus-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-SysAPlus2026!Secure}"
      MSSQL_PID: "Developer"
    # Solo desde esta PC: la base no queda expuesta a la red.
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-SysAPlus2026!Secure}\" -C -Q 'SELECT 1' 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-SysAPlus2026!Secure}\" -Q 'SELECT 1'"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - sysaplus-net

  # API Backend (Node.js + Express + Prisma)
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: sysaplus-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: "${NODE_ENV:-production}"
      DATABASE_URL: "${DATABASE_URL:-sqlserver://sqlserver:1433;database=sysaplus;user=sa;password=SysAPlus2026!Secure;encrypt=true;trustServerCertificate=true;}"
      JWT_SECRET: "${JWT_SECRET:-sysaplus_super_secret_jwt_key_2026!}"
      SESSION_HOURS: "${SESSION_HOURS:-8}"
      REMEMBER_ME_DAYS: "${REMEMBER_ME_DAYS:-7}"
      LOGIN_MAX_ATTEMPTS: "${LOGIN_MAX_ATTEMPTS:-5}"
      LOGIN_LOCK_MINUTES: "${LOGIN_LOCK_MINUTES:-15}"
      # Hilos de libuv: ahí corre bcrypt (login). Node usa 4 por defecto.
      UV_THREADPOOL_SIZE: "${UV_THREADPOOL_SIZE:-8}"
      DB_POOL_MAX: "${DB_POOL_MAX:-20}"
      DB_TX_MAX_WAIT_MS: "${DB_TX_MAX_WAIT_MS:-10000}"
      LOGIN_IP_MAX_ATTEMPTS: "${LOGIN_IP_MAX_ATTEMPTS:-3}"
      LOGIN_IP_BLOCK_MINUTES: "${LOGIN_IP_BLOCK_MINUTES:-15}"
    # Solo desde esta PC: desde la red se entra por nginx (frontend), que es quien
    # agrega X-Forwarded-For. Expuesta, cualquiera podría falsear su IP salteando nginx.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - sysaplus-net

  # Aplicación Web Frontend (React + Vite servido en Nginx)
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: sysaplus-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
      - "80:80"
    depends_on:
      - backend
    networks:
      - sysaplus-net

  # Pruebas de carga (k6). No arranca con "up": se usa con "docker compose run --rm k6 run /scripts/<escenario>.js".
  # Ver loadtest/README.md.
  k6:
    image: grafana/k6:latest
    profiles: ["carga"]
    volumes:
      - ./loadtest:/scripts:ro
      - ./loadtest/resultados:/resultados
    environment:
      BASE_URL: http://frontend
    depends_on:
      - frontend
    networks:
      - sysaplus-net

volumes:
  sqlserver_data:

networks:
  sysaplus-net:
    driver: bridge
